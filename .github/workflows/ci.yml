name: tests

# The same gates the pre-commit hook runs locally, so a clone without the hook
# installed is still covered.
on:
  push:
  pull_request:

# Nothing here writes to the repository.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor stated in pyproject.toml, and current.
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      # cov runs the fast suite under coverage, so running fast separately would
      # be the same tests twice.
      - name: Fast suite, coverage gated at 95%
        run: ./run-tests.sh cov
      - name: Types
        run: ./run-tests.sh types
      - name: Long suite
        run: ./run-tests.sh long
