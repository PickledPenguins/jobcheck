# Deliberately in a different directory: load_overrides_from_files takes paths
# from anywhere, and precedence follows the order the paths are given.
#
# The name differs from the rule in ../error_overrides.yaml that does the same
# thing, because rule names are unique across every file loaded together: two
# files sharing a name cannot be combined, and these are meant to be.

- name: "disable_age_integer_check_from_another_directory"
  message: "Example: disable AGE_NOT_INTEGER for every row, no filtering"
  action: disable
  codes:
    - AGE_NOT_INTEGER
  match: all
