# Loaded first by load_overrides_from_dir (alphabetical filename order),
# so anything in 02_*.yaml touching the same code wins over this file.
#
# The names here end "_by_topic" so that this directory can be loaded alongside
# ../error_overrides.yaml, which carries rules doing the same job: rule names are
# unique across every file in one load, and two files sharing one cannot be
# combined at all.

- name: "enable_legacy_integer_check_by_topic"
  description: "Turn on strict integer check for legacy-system batch rows"
  action: enable
  codes:
    - AGE_NOT_INTEGER
  match:
    - column: source_system
      pattern: "^LEGACY_.*"
    - column: record_type
      pattern: "^BATCH$"
