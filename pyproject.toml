[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "jobcheck"
version = "0.2.0"
description = "Validate rows of a pandas DataFrame with many small, dependent, named tests."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Chris Harris" }]
dependencies = [
    "pandas>=2.1",   # DataFrame.map, used when rendering a CSV report
    "PyYAML>=6.0",
]

[project.optional-dependencies]
# Everything needed to work on the project, so that installing it once means the
# whole suite runs. hypothesis in particular was previously optional, which made
# tests/test_properties.py skip silently everywhere but one machine.
dev = [
    "pytest>=8.0",
    "coverage>=7.0",
    "mypy>=1.0",
    "types-PyYAML",
    "hypothesis>=6.0",
    "mutmut>=3.0",
]

[tool.setuptools.packages.find]
where = ["src"]

# Ships the annotations: without this marker mypy treats an installed copy as
# untyped, however carefully the source is annotated.
[tool.setuptools.package-data]
jobcheck = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "fast: unit, smoke, interface, regression, cheap pathological. Gates every commit.",
    "long: integration, load, end-to-end, catalogs. Gates every release.",
    "perf: timing against this machine's recorded baseline. Its own gate: ./run-tests.sh perf.",
    "memory: peak-memory ceilings, measured under tracemalloc. Its own gate: ./run-tests.sh memory.",
]

[tool.coverage.run]
# The library, and the example checks the tests drive: both are code this
# repository is responsible for, and a broken example should show as a gap.
source = ["jobcheck", "main", "perf_baseline", "examples/checks"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]

[tool.mypy]
files = ["src", "examples", "scripts", "tests"]
ignore_missing_imports = true
# tests/ is not a package, and scripts/ imports its helpers by name, so the same
# file can otherwise be reached under two module names.
mypy_path = "src:tests"
explicit_package_bases = true

[tool.mutmut]
paths_to_mutate = ["src/jobcheck/"]
# The entry points, the example suites and the example data the tests load live
# here; scripts/ comes too because a test regenerates the data files from the
# generator and compares, which needs the generator inside the mutants tree.
also_copy = ["examples/", "scripts/"]
# Excludes tests that shell out to a subprocess: mutmut's trampoline only sees
# its own config inside the process it orchestrates, and a subprocess that just
# runs "python examples/main.py" never loads it. Coverage of those files is
# unaffected -- they are exercised by the normal test suite, just not mutated.
pytest_add_cli_args_test_selection = [
    "--ignore=tests/test_interface_cli.py",
    "--ignore=tests/test_smoke.py",
    "--ignore=tests/test_packaging.py",
    "--ignore=tests/test_e2e_catalogs.py",
    # Inspects the module's own structure (vars(), __all__ completeness), which
    # mutmut's generated trampoline functions make noisy for reasons that have
    # nothing to do with mutation coverage.
    "--ignore=tests/test_api_contract.py",
    # Checks that the README and its linked docs exist and match the code; the
    # mutants tree only carries the package, tests and examples, not docs/.
    "--ignore=tests/test_readme.py",
    # Same reason as test_readme.py: it reads docs/, which the mutants tree does
    # not carry, so every mutant would fail collection rather than being tested.
    "--ignore=tests/test_docs_unit.py",
    # Excluded for cost rather than correctness: mutmut runs the whole selection
    # once per mutant, so a suite member that takes a minute makes the run take
    # days. Each of these is covered by a faster test of the same behaviour --
    # the volume and shape suites restate what the unit tests assert, the perf
    # and memory gates measure rather than assert behaviour, and the concurrency
    # suite spends its time in subprocesses mutmut cannot instrument anyway.
    "--ignore=tests/test_load.py",
    "--ignore=tests/test_scaling.py",
    "--ignore=tests/test_perf.py",
    "--ignore=tests/test_memory.py",
    "--ignore=tests/test_concurrency.py",
    "--ignore=tests/test_properties.py",
    "--ignore=tests/test_fuzz.py",
]
