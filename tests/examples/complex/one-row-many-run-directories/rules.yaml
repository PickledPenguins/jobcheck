# OWNER_PRESENT is about the job, not one run: without this rule a blank owner
# would be reported once per run. Nothing depends on it, so turning it off
# skips no per-run check.
- name: "owner_once_per_job"
  message: "Check the owner on the job's first run only"
  action: disable
  codes:
    - OWNER_PRESENT
  match:
    - column: instance
      pattern: "^(?!1$)"

# One run of one job, switched off by its key. INPUT_EXISTS depends on
# RUN_DIR_EXISTS, so it is skipped on that run as well.
- name: "gamma2_not_started"
  message: "J3's second run has not been set up yet"
  action: disable
  codes:
    - RUN_DIR_EXISTS
  match:
    - column: key
      pattern: "^J3#2$"
